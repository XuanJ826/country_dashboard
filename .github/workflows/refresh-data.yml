name: Refresh economic data

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economic-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python refresh_data.py --scheduled
      - name: Save refresh record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/refresh_status.json docs/data_verification.csv docs/data_verification.md docs/refresh_evidence.log
          if ! git diff --cached --quiet; then
            git commit -m "Record scheduled economic data refresh"
            git push
          fi
